name: docker-build-mysql80

on:
  push:
    branches: [main]
    paths:
      - 'bitnami/mysql80/**'
      - '.github/workflows/docker-build-mysql80.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_DIR: mysql80
  IMAGE: moechs/bitnami-mysql

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - id: set
        run: |
          set -euo pipefail
          items=()
          while IFS= read -r f; do
            dir="$(dirname "$f")"
            os="$(basename "$dir")"
            ver="$(sed -n 's/^ARG MYSQL_VERSION=//p' "$f" | head -1)"
            rev="$(sed -n 's/^ARG IMAGE_REVISION=//p' "$f" | head -1)"
            [ -n "$ver" ] && [ -n "$rev" ] || { echo "cannot parse version from $f"; exit 1; }
            minor="${ver%.*}"
            tags="${ver}-${os}-r${rev} ${ver} ${minor}"
            items+=("$(jq -cn --arg d "$f" --arg c "$dir" --arg s "$os" --arg t "$tags" \
              '{dockerfile:$d, context:$c, slug:$s, tags:$t}')")
          done < <(find "bitnami/${PROJECT_DIR}" -name Dockerfile | sort)
          [ "${#items[@]}" -gt 0 ] || { echo "no Dockerfile found"; exit 1; }
          echo "matrix=$(printf '%s\n' "${items[@]}" | jq -cs .)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: build ${{ matrix.item.slug }} ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJson(needs.prepare.outputs.matrix) }}
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: moechs
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.item.context }}
          file: ${{ matrix.item.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.item.slug }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    name: merge ${{ matrix.item.slug }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        item: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.item.slug }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: moechs
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifests
        working-directory: /tmp/digests
        env:
          TAGS: ${{ matrix.item.tags }}
        run: |
          set -euo pipefail
          refs="$(printf "${IMAGE}@sha256:%s " *)"
          for t in $TAGS; do
            docker buildx imagetools create -t "${IMAGE}:${t}" $refs
          done

      - name: Inspect
        env:
          TAGS: ${{ matrix.item.tags }}
        run: |
          docker buildx imagetools inspect "${IMAGE}:${TAGS%% *}"
